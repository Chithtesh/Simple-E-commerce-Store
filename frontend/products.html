<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">&#128722;</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link active">Products</a></li>
        <li><a href="cart.html" class="nav-link cart-link">
          Cart <span class="cart-count" id="navCartCount">0</span>
        </a></li>
        <li class="nav-auth" id="navAuth">
          <a href="login.html" class="nav-link">Login</a>
          <a href="register.html" class="nav-link">Register</a>
        </li>
        <li class="nav-user" id="navUser" style="display: none;">
          <a href="profile.html" class="nav-link" id="navUserName">Profile</a>
          <a href="#" class="nav-link" id="navLogout">Logout</a>
        </li>
        <li class="nav-admin" id="navAdmin" style="display: none;">
          <a href="admin/dashboard.html" class="nav-link">Admin</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Search and Filter Section -->
  <section class="search-section">
    <div class="container">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search products...">
        <select id="categoryFilter">
          <option value="All">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion</option>
          <option value="Accessories">Accessories</option>
          <option value="Home">Home</option>
          <option value="Books">Books</option>
        </select>
        <select id="sortFilter">
          <option value="default">Sort By</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name">Name</option>
        </select>
        <button class="btn btn-primary" id="searchBtn">Search</button>
      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section class="products-section">
    <div class="container">
      <h2 class="section-title">All Products</h2>
      <div class="products-grid" id="productsGrid">
        <div class="loading">Loading products...</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopEase. Built for CodeAlpha Internship.</p>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
