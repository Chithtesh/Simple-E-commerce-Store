<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">&#128722;</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
        <li><a href="cart.html" class="nav-link cart-link">
          Cart <span class="cart-count" id="navCartCount">0</span>
        </a></li>
        <li class="nav-auth" id="navAuth">
          <a href="login.html" class="nav-link">Login</a>
          <a href="register.html" class="nav-link">Register</a>
        </li>
        <li class="nav-user" id="navUser" style="display: none;">
          <a href="profile.html" class="nav-link" id="navUserName">Profile</a>
          <a href="#" class="nav-link" id="navLogout">Logout</a>
        </li>
        <li class="nav-admin" id="navAdmin" style="display: none;">
          <a href="admin/dashboard.html" class="nav-link">Admin</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Order Success Section -->
  <section class="order-success-section">
    <div class="container">
      <div class="order-success-card">
        <div class="success-icon">&#10004;</div>
        <h2>Order Placed Successfully!</h2>
        <p>Thank you for your purchase. Your order has been confirmed.</p>
        <div class="order-info" id="orderInfo">
          <div class="loading">Loading order details...</div>
        </div>
        <div class="success-actions">
          <a href="orders.html" class="btn btn-primary">View My Orders</a>
          <a href="products.html" class="btn btn-secondary">Continue Shopping</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopEase. Built for CodeAlpha Internship.</p>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
