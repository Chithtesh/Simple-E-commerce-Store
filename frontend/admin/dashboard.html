<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ShopEase</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <span class="logo-icon">&#128722;</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="../products.html" class="nav-link">Products</a></li>
        <li><a href="../cart.html" class="nav-link cart-link">
          Cart <span class="cart-count" id="navCartCount">0</span>
        </a></li>
        <li class="nav-auth" id="navAuth">
          <a href="../login.html" class="nav-link">Login</a>
          <a href="../register.html" class="nav-link">Register</a>
        </li>
        <li class="nav-user" id="navUser" style="display: none;">
          <a href="../profile.html" class="nav-link" id="navUserName">Profile</a>
          <a href="#" class="nav-link" id="navLogout">Logout</a>
        </li>
        <li class="nav-admin" id="navAdmin" style="display: none;">
          <a href="dashboard.html" class="nav-link active">Admin</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Admin Dashboard Section -->
  <section class="admin-section">
    <div class="container">
      <h2 class="section-title">Admin Dashboard</h2>
      <div class="admin-stats" id="adminStats">
        <div class="stat-card">
          <h3>Total Products</h3>
          <p class="stat-number" id="totalProducts">-</p>
        </div>
        <div class="stat-card">
          <h3>Total Users</h3>
          <p class="stat-number" id="totalUsers">-</p>
        </div>
        <div class="stat-card">
          <h3>Total Orders</h3>
          <p class="stat-number" id="totalOrders">-</p>
        </div>
        <div class="stat-card">
          <h3>Total Sales</h3>
          <p class="stat-number" id="totalSales">-</p>
        </div>
      </div>
      <div class="admin-links">
        <a href="products.html" class="btn btn-primary">Manage Products</a>
        <a href="orders.html" class="btn btn-secondary">Manage Orders</a>
        <a href="users.html" class="btn btn-secondary">Manage Users</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopEase. Built for CodeAlpha Internship.</p>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
